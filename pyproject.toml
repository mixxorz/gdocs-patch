[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "fixit>=2.2.1",
    "packaging>=26.0",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["packages", "scripts"]

[tool.ruff]
src = ["packages/gdocs-patch/src", "packages/gsheets-patch/src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.fixit]
enable = ["codemods"]

[tool.pyright]
include = ["packages/*/src"]
extraPaths = ["packages/gdocs-patch/src", "packages/gsheets-patch/src"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
