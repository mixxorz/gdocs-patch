[project]
name = "gdocs-patch"
version = "0.1.0"
description = "Apply structured patches to Google Docs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gdocs-patch = "gdocs_patch.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["gdocs_patch"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
