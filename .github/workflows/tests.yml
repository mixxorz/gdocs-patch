name: Code quality and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev --all-extras

      - name: Check lockfile
        run: uv lock --check

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Fixit
        run: uv run fixit lint .

      - name: Run Pyright
        run: uv run pyright

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  tests:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev --all-extras

      - name: Run tests
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install build tools
        run: uv sync --locked --dev

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uv run twine check --strict dist/*

      - name: Smoke-test base wheel
        run: |
          wheel=$(echo dist/*.whl)
          uv venv --python 3.14 /tmp/gdocs-patch-base
          uv pip install --python /tmp/gdocs-patch-base/bin/python "$wheel"
          /tmp/gdocs-patch-base/bin/gdocs-patch --help >/dev/null
          /tmp/gdocs-patch-base/bin/gdocs-patch --version
          if output=$(/tmp/gdocs-patch-base/bin/gdocs-patch-mcp 2>&1); then
            echo "gdocs-patch-mcp unexpectedly started without the mcp extra" >&2
            exit 1
          fi
          grep -F "MCP support is not installed" <<<"$output"

      - name: Smoke-test wheel with MCP extra
        run: |
          wheel=$(echo dist/*.whl)
          uv venv --python 3.14 /tmp/gdocs-patch-mcp
          uv pip install --python /tmp/gdocs-patch-mcp/bin/python "${wheel}[mcp]"
          /tmp/gdocs-patch-mcp/bin/gdocs-patch-mcp --help >/dev/null
          cd /tmp
          GDOCS_PATCH_MCP_TOKEN=smoke-test \
            /tmp/gdocs-patch-mcp/bin/python -I -c \
            "import gdocs_patch.mcp_server.server"
